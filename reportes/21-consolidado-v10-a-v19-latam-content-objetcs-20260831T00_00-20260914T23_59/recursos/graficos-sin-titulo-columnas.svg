<text x="16" y="44" font-size="12" fill="#5f6b76">80,799 filas sin título (138,465,959,120 requests; 68.8% vendidos; eCPM ponderado $4.12).</text>
<text x="16" y="60" font-size="12" fill="#5f6b76">Por columna: x = % de esas filas con dato útil, y = eCPM ponderado de esas filas. Círculo = tal como llega; rombo = tras el relleno; la línea une los dos estados.</text>
<text x="16" y="76" font-size="12" fill="#5f6b76">Si el círculo y el rombo coinciden, el relleno no cambió esa columna en las filas sin título. Línea punteada: eCPM ponderado de todas las filas sin título.</text>

<text x="16" y="44" font-size="12" fill="#5f6b76">80,799 filas sin título del consolidado tal como llega, antes del relleno (138,465,959,120 requests; 68.8% vendidos; eCPM ponderado $4.12).</text>
<text x="16" y="60" font-size="12" fill="#5f6b76">Por columna, esas filas se parten en dos grupos: las que traen dato útil y las que la traen vacía. Bajo cada eCPM, el % de las filas sin título en ese grupo.</text>

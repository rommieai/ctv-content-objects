<text x="16" y="24" font-size="17" font-weight="700" fill="#1f2933">Registros sin contentTitle: requests totales con y sin dato en cada columna</text>
<text x="16" y="44" font-size="12" fill="#5f6b76">110,639 filas sin título del consolidado tal como llega, antes del relleno (158,711,163,012 requests; 75.3% vendidos).</text>
<text x="16" y="60" font-size="12" fill="#5f6b76">Por columna, esas filas se parten en dos grupos: las que traen dato útil y las que la traen vacía. Bajo cada valor, el % de los requests sin título en ese grupo.</text>
<text x="16" y="76" font-size="12" fill="#5f6b76">Requests totales (vendidos o no), en miles de millones. Mismo orden de columnas que la gráfica de eCPM; en cada columna los dos puntos suman el total.</text>
